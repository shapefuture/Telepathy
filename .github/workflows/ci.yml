name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (unit, ACL, replay, state machine, architecture)
        run: uv run pytest

  worker:
    name: worker (Cloudflare)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests (real workerd + D1 via Miniflare)
        run: npm test
      - name: Bundle builds under the free-plan size limit
        run: npx wrangler deploy --dry-run --outdir dist
