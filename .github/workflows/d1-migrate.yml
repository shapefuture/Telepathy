# Manual only: lists, or applies, the D1 migrations of the telepathy database. It never deploys the
# Worker (deploy-worker.yml does that). Needs the repository variable D1_DATABASE_ID and the secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, as the other Cloudflare workflows do.
# "list" only reads. "apply" writes to the production database; migrations are forward-only.
name: D1 migrations (manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list (read-only) or apply (writes to the production database)"
        type: choice
        options:
          - list
          - apply
        default: list
        required: true

permissions:
  contents: read

concurrency:
  group: d1-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Check the database id is set
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::Set the repository variable D1_DATABASE_ID first."
            exit 1
          fi
      - name: Point wrangler.jsonc at the real D1 database (not committed)
        run: sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.jsonc
      - name: Pending migrations
        run: npx wrangler d1 migrations list telepathy --remote
      - name: Concierge tables present? (read-only)
        run: npx wrangler d1 execute telepathy --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('join_screens','spam_flags','answer_proposals','intro_rounds')"
      - name: Apply pending migrations (forward-only)
        if: inputs.action == 'apply'
        run: npx wrangler d1 migrations apply telepathy --remote
