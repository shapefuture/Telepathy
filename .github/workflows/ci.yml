name: CI

on:
  pull_request:
    paths: ["src/**", "tests/**", "contracts/**", "pyproject.toml", "uv.lock", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "contracts/**", "pyproject.toml", "uv.lock", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Actions minutes: only run for changed code, and cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (unit, ACL, replay, state machine, architecture)
        run: uv run pytest
